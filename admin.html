<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم سَلِس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a41;--mut:#6b7a90;--bg:#f3f5f8;--card:#fff;--line:#dfe5ec;--acc:#2457e6;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf4;--mut:#93a1b5;--bg:#0f1622;--card:#182131;--line:#26324a;--acc:#6b93ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'IBM Plex Sans Arabic',Tahoma,sans-serif;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header b{flex:1;font-size:17px}
main{max-width:760px;margin:auto;padding:14px}
h3{margin:18px 0 4px;font-size:15px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 2px;font-size:12px;color:var(--mut);display:grid;justify-items:center;gap:1px}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{margin:0}
.stats b{display:block;font-size:19px;line-height:1.4}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
input[type=checkbox]{width:22px;height:22px}
label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btn{display:inline-block;border:0;border-radius:9px;padding:9px 15px;background:var(--acc);color:#fff;font-weight:500;text-decoration:none;cursor:pointer}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border-radius:99px;padding:1px 10px;font-size:12px;color:#fff}
.oh{display:grid;gap:1px;cursor:pointer}
.bd{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.ln{display:grid;grid-template-columns:1fr auto 90px;gap:8px;padding:4px 0}
.ln span:last-child{text-align:left}
.toast{position:fixed;bottom:92px;inset-inline:16px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;z-index:9}
.toast.bad{background:var(--bad);color:#fff}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.login h1{font-size:22px;margin:0 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB='https://pkgkyfaeabcaxpoawsso.supabase.co',
KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ2t5ZmFlYWJjYXhwb2F3c3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5Nzg1OTgsImV4cCI6MjExMDU1NDU5OH0.rgT2x_dzf6wD4dr89iRYiuV3CY6dPN-L9a4G5JLuy_8';
const db=supabase.createClient(SB,KEY),$=s=>document.querySelector(s);
const x=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=n=>Number(n||0).toLocaleString('ar-EG')+' جنيه';
const when=d=>new Date(d).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'});
const wa=p=>'https://wa.me/'+(p[0]=='0'?'2'+p:p.replace(/\D/g,''));
const ST={new:['جديد','#2457e6'],confirmed:['مؤكد','#c77700'],shipped:['اتشحن','#7a4fd6'],delivered:['اتسلّم','#1e8e5a'],cancelled:['ملغي','#c0392b']};
const NX={new:['confirmed','تأكيد الطلب'],confirmed:['shipped','تم الشحن'],shipped:['delivered','تم التسليم']};
const TABS=[['orders','🧾','الطلبات'],['products','📦','المنتجات'],['stock','🔢','المخزون'],['ship','🚚','الشحن'],['coupons','🏷️','الكوبونات']];
const S={tab:'orders',flt:'all',q:'',open:null,orders:[],prods:[]};
const main=h=>$('main').innerHTML=h;
const err=e=>e.code=='23505'?'العنصر ده موجود بالفعل':(e.message||'حصل خطأ');
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

/* ---------- auth ---------- */
function login(msg){
 $('#app').innerHTML=`<div class=login><h1>لوحة تحكم سَلِس</h1><p class=mut>${x(msg||'سجّل دخول بحساب الأدمن')}</p>
 <div class=card><label>الإيميل<input id=em type=email autocomplete=username dir=ltr></label><br><label>كلمة السر<input id=pw type=password autocomplete=current-password dir=ltr></label>
 <div class=row><button class=btn id=go>دخول</button></div></div></div>`;
 const go=async()=>{const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  error?toast('الإيميل أو كلمة السر غلط',1):boot()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>e.key=='Enter'&&go();
}
async function boot(){
 const{data:{session}}=await db.auth.getSession();if(!session)return login();
 const{data:ok}=await db.rpc('is_admin');if(!ok){await db.auth.signOut();return login('الحساب ده مش مفعّل كأدمن')}
 $('#app').innerHTML=`<header><b>لوحة سَلِس</b><button class="btn s" data-act=refresh>تحديث</button><button class="btn s" data-act=out>خروج</button></header><main></main><nav>${TABS.map(t=>`<button data-tab=${t[0]}><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
 go(S.tab);
}
function nav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==S.tab))}

/* ---------- generic editable cards ---------- */
const G={
 products:['id','id',[['name','الاسم','t'],['price','السعر (جنيه)','n'],['active','ظاهر في المتجر','b']]],
 product_stock:['id','product_id',[['product_id','المنتج','p'],['size','المقاس','z'],['color','اللون','t'],['qty','الكمية المتاحة','n']]],
 shipping_rates:['governorate','governorate',[['governorate','المحافظة','r'],['fee','سعر الشحن','n'],['active','متاح','b']]],
 coupons:['code','code',[['code','الكود','c'],['kind','النوع','k'],['value','القيمة','n'],['min_order','أقل قيمة للطلب','n'],['max_uses','أقصى عدد استخدام (اختياري)','n0'],['used_count','اتستخدم','r'],['expires_at','ينتهي في (اختياري)','d'],['active','شغال','b']]],
 store_settings:['id','id',[['whatsapp_number','رقم واتساب (بصيغة 20…)','t'],['default_shipping_fee','شحن افتراضي','n'],['free_shipping_over','شحن مجاني لو الطلب فوق (اختياري)','n0']]]
};
const NEW={products:{name:'',price:0,active:true},product_stock:{size:'',color:'',qty:0},coupons:{kind:'percent',value:10,min_order:0,active:true}};
const opt=(v,a)=>a.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
function fld([k,l,t],v,isNew){let h;
 if(t=='b')h=`<input type=checkbox data-k=${k} ${v?'checked':''}>`;
 else if(t=='r'||(t=='c'&&!isNew))h=`<b>${x(v)}</b>`;
 else if(t=='p')h=`<select data-k=${k}>${opt(v,S.prods.map(p=>[p.id,x(p.name)]))}</select>`;
 else if(t=='z')h=`<select data-k=${k}>${opt(v,[['','أي مقاس'],['M','M'],['L','L'],['XL','XL'],['2XL','2XL'],['3XL','3XL']])}</select>`;
 else if(t=='k')h=`<select data-k=${k}>${opt(v,[['percent','نسبة %'],['fixed','مبلغ ثابت']])}</select>`;
 else if(t=='d')h=`<input type=date data-k=${k} value="${v?String(v).slice(0,10):''}">`;
 else if(t[0]=='n')h=`<input type=number min=0 inputmode=numeric data-k=${k} data-t=${t} value="${v??''}">`;
 else h=`<input data-k=${k} value="${x(v)}">`;
 return `<label>${l}${h}</label>`}
function rowCard(tb,r,isNew){const[key,,cols]=G[tb],fixed=tb=='shipping_rates'||tb=='store_settings';
 return `<div class=card data-tb=${tb} data-id="${isNew?'':x(r[key])}"><div class=fg>${cols.map(c=>fld(c,r[c[0]],isNew)).join('')}</div>
 <div class=row><button class=btn data-act=save>${isNew?'إضافة':'حفظ'}</button>${isNew||fixed?'':'<button class="btn d" data-act=del>حذف</button>'}</div></div>`}
function collect(el){const o={};el.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;
 o[k]=i.type=='checkbox'?i.checked:i.type=='number'?(i.value===''?(i.dataset.t=='n0'?null:0):+i.value):
 k=='product_id'?+i.value:i.type=='date'?(i.value?new Date(i.value+'T23:59:59').toISOString():null):
 k=='code'?i.value.trim().toUpperCase():i.value.trim()});return o}
async function save(card){const tb=card.dataset.tb,id=card.dataset.id,key=G[tb][0],v=collect(card);
 if(tb=='products'&&!v.name)return toast('اكتب اسم المنتج',1);
 if(tb=='coupons'&&!id&&v.code.length<3)return toast('الكود لازم 3 حروف على الأقل',1);
 let q;if(!id)q=db.from(tb).insert(v);else{delete v[key];q=db.from(tb).update(v).eq(key,id)}
 const{error}=await q;if(error)return toast(err(error),1);
 toast(id?'تم الحفظ':'تمت الإضافة');if(!id)go(S.tab)}
async function del(card){if(!confirm('متأكد إنك عايز تحذف؟'))return;
 const tb=card.dataset.tb,{error}=await db.from(tb).delete().eq(G[tb][0],card.dataset.id);
 error?toast(err(error),1):(toast('تم الحذف'),go(S.tab))}

/* ---------- orders ---------- */
async function ordersView(){
 const{data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(300);
 if(error)return main(`<div class=card>${x(error.message)}</div>`);S.orders=data;drawOrders()}
function drawOrders(){
 const O=S.orders,live=O.filter(o=>o.status!='cancelled'),day=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}),
 today=day(new Date()),sum=a=>a.reduce((s,o)=>s+o.total_amount,0),tp={};
 live.filter(o=>Date.now()-new Date(o.created_at)<30*864e5).forEach(o=>o.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));
 const top=Object.entries(tp).sort((a,b)=>b[1]-a[1])[0],cnt=s=>O.filter(o=>o.status==s).length;
 const chips=[['all','الكل',O.length],...Object.keys(ST).map(k=>[k,ST[k][0],cnt(k)])];
 main(`<div class=stats>
  <div class=card><span class=mut>مبيعات النهارده</span><b>${M(sum(live.filter(o=>day(o.created_at)==today)))}</b></div>
  <div class=card><span class=mut>آخر 7 أيام</span><b>${M(sum(live.filter(o=>Date.now()-new Date(o.created_at)<7*864e5)))}</b></div>
  <div class=card><span class=mut>طلبات جديدة</span><b>${cnt('new')}</b></div>
  <div class=card><span class=mut>الأكثر مبيعًا (30 يوم)</span><b style="font-size:15px">${top?x(top[0])+' ('+top[1]+')':'—'}</b></div></div>
  <div class=chips>${chips.map(c=>`<button class="chip ${S.flt==c[0]?'on':''}" data-flt=${c[0]}>${c[1]} (${c[2]})</button>`).join('')}</div>
  <input id=sq placeholder="ابحث بالاسم أو الموبايل أو رقم الطلب" value="${x(S.q)}"><div id=ol></div>`);
 $('#sq').oninput=e=>{S.q=e.target.value;olist()};olist()}
function olist(){const q=S.q.trim().toLowerCase(),
 L=S.orders.filter(o=>(S.flt=='all'||o.status==S.flt)&&(!q||`${o.id} ${o.customer_name} ${o.customer_phone}`.toLowerCase().includes(q)));
 $('#ol').innerHTML=L.map(ocard).join('')||'<p class=mut>مفيش طلبات هنا.</p>'}
function ocard(o){const[st,c]=ST[o.status],op=S.open==o.id,nx=NX[o.status];
 return `<article class=card data-id=${o.id}><div class=oh data-act=tog><div><b>#${o.id}</b> <span class=pill style="background:${c}">${st}</span></div>
 <div>${x(o.customer_name)} — ${x(o.customer_phone)}</div><div class=mut>${when(o.created_at)}${o.governorate?' — '+x(o.governorate):''}</div><b>${M(o.total_amount)}</b></div>
 ${op?`<div class=bd>${o.items.map(i=>`<div class=ln><span>${x(i.name)}<br><small class=mut>${x(i.size)}${i.color?' — '+x(i.color):''}</small></span><span>× ${i.qty}</span><span>${M(i.price*i.qty)}</span></div>`).join('')}
 <div class=ln><span>المجموع</span><span></span><span>${M(o.subtotal)}</span></div>
 ${o.discount?`<div class=ln><span>خصم (${x(o.coupon_code)})</span><span></span><span>-${M(o.discount)}</span></div>`:''}
 <div class=ln><span>الشحن</span><span></span><span>${o.shipping_fee?M(o.shipping_fee):'مجاني'}</span></div>
 <p>📍 ${x(o.customer_address)}</p>
 <label>ملاحظات داخلية<textarea rows=2 data-k=notes>${x(o.notes)}</textarea></label>
 <div class=row>${nx?`<button class=btn data-act=next data-to=${nx[0]}>${nx[1]}</button>`:''}<button class="btn s" data-act=note>حفظ الملاحظة</button>
 <a class="btn s" href="${wa(o.customer_phone)}" target=_blank rel=noopener>واتساب</a><a class="btn s" href="tel:${x(o.customer_phone)}">اتصال</a>
 ${['delivered','cancelled'].includes(o.status)?'':'<button class="btn d" data-act=cancel>إلغاء الطلب</button>'}</div></div>`:''}</article>`}
async function upd(id,v,msg){const{error}=await db.from('orders').update(v).eq('id',id);
 if(error)return toast(err(error),1);toast(msg);ordersView()}

/* ---------- other tabs ---------- */
async function go(t){S.tab=t;nav();main('<p class=mut>جاري التحميل…</p>');
 if(t=='orders')return ordersView();
 const{data:p}=await db.from('products').select('*').order('id');S.prods=p||[];
 const rows=async(tb,o)=>(await db.from(tb).select('*').order(o)).data||[];
 if(t=='products')return main(`<h3>منتج جديد</h3>${rowCard('products',NEW.products,1)}<h3>المنتجات</h3>${S.prods.map(r=>rowCard('products',r)).join('')}
  <p class=mut>السعر هنا هو اللي بيتحسب في الطلبات، مهما اتبعت من الموقع.</p>`);
 if(t=='stock')return main(`<div class="card mut">المنتج اللي ملوش صفوف هنا بيتباع من غير حد. أول ما تضيف صف لمنتج، الطلبات بتتحقق من المخزون وبتخصم منه، والإلغاء بيرجّعه. اترك المقاس أو اللون فاضي لو الكمية تنفع لأي مقاس أو لون.</div>
  <h3>إضافة كمية</h3>${rowCard('product_stock',{...NEW.product_stock,product_id:S.prods[0]?.id},1)}<h3>المخزون الحالي</h3>${(await rows('product_stock','product_id')).map(r=>rowCard('product_stock',r)).join('')||'<p class=mut>مفيش مخزون متسجل.</p>'}`);
 if(t=='coupons')return main(`<h3>كوبون جديد</h3>${rowCard('coupons',NEW.coupons,1)}<h3>الكوبونات</h3>${(await rows('coupons','code')).map(r=>rowCard('coupons',r)).join('')||'<p class=mut>مفيش كوبونات.</p>'}`);
 if(t=='ship'){const{data:st}=await db.from('store_settings').select('*').eq('id',1).single();
  main(`<h3>إعدادات المتجر</h3>${rowCard('store_settings',st)}
  <h3>سعر موحّد لكل المحافظات</h3><div class=card><label>السعر<input id=bulk type=number min=0 inputmode=numeric></label><div class=row><button class="btn s" data-act=bulk>تطبيق على الكل</button></div></div>
  <h3>الشحن حسب المحافظة</h3>${(await rows('shipping_rates','governorate')).map(r=>rowCard('shipping_rates',r)).join('')}`)}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const tb=e.target.closest('[data-tab]');if(tb)return go(tb.dataset.tab);
 const ch=e.target.closest('[data-flt]');if(ch){S.flt=ch.dataset.flt;return drawOrders()}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,card=b.closest('[data-id]'),id=card&&+card.dataset.id;
 if(a=='refresh')return go(S.tab);
 if(a=='out'){await db.auth.signOut();return login()}
 if(a=='tog'){S.open=S.open==id?null:id;return olist()}
 if(a=='next')return upd(id,{status:b.dataset.to},'تم تحديث الحالة');
 if(a=='note')return upd(id,{notes:card.querySelector('[data-k=notes]').value.trim()||null},'تم حفظ الملاحظة');
 if(a=='cancel'&&confirm('إلغاء الطلب هيرجّع المخزون والكوبون، ومينفعش يتفتح تاني. متأكد؟'))return upd(id,{status:'cancelled'},'تم إلغاء الطلب');
 if(a=='save')return save(b.closest('[data-tb]'));
 if(a=='del')return del(b.closest('[data-tb]'));
 if(a=='bulk'){const v=$('#bulk').value;if(v==='')return toast('اكتب السعر',1);
  const{error}=await db.from('shipping_rates').update({fee:+v}).neq('governorate','');error?toast(err(error),1):(toast('تم التطبيق'),go('ship'))}
});
document.addEventListener('visibilitychange',()=>!document.hidden&&S.tab=='orders'&&$('main')&&ordersView());
boot();
</script>
</body>
</html>
